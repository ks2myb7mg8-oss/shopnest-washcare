<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopNest | 洗护目录</title><link rel="stylesheet" href="./css/style.css"><style>.filters{display:flex;gap:12px;margin:28px 0}.filters input,.filters select{font:inherit;padding:12px;border:1px solid var(--border);border-radius:8px;background:white}.filters input{flex:1;min-width:0}.card img{object-fit:contain;height:220px;padding:8px}.tagline{color:var(--ink-soft)}.navbrand{height:64px;display:flex;align-items:center;justify-content:space-between}.navbrand span{font-size:14px;color:var(--ink-soft)}</style></head><body>
<nav class="navbar"><div class="container navbrand"><a class="brand" href="./"><span class="brand-mark">S</span>ShopNest</a><span>商品目录 · 洗护</span></div></nav>
<section class="hero"><div class="container"><h1>美妆商品目录</h1><p>查看洗发水、护发素、沐浴露及个人护理产品。商品价格以实际确认信息为准。</p></div></section>
<main class="container"><div class="filters"><input id="search" type="search" placeholder="搜索商品名称…"><select id="kind"><option value="">所有商品</option><option>洗发水</option><option>护发素</option><option>沐浴</option><option>洗手液</option><option>防晒</option><option>护肤礼盒</option><option>香氛礼盒</option><option>护手霜</option></select></div><h2 class="section-title">商品 · <span id="count"></span> 件商品</h2><div id="grid" class="grid"></div></main>
<footer>ShopNest 原版 CSS 主题 · 洗护目录展示版</footer>
<script>
const items=[["ALTAY SIBERIA 防晒霜 SPF50+","IMG_3558(1).jpg",2500,"面部与身体防晒霜","洗护"],["YOUMAIDOU 绿色护发素 800ml","IMG_3560(1).jpg",1600,"柔顺护发素","洗护"],["YOUMAIDOU 蓝色护发素 758ml","IMG_3562(1).jpg",1600,"护发素","洗护"],["YOUMAIDOU 粉色洗发水 758ml","IMG_3563(1).jpg",1600,"洗发水","洗护"],["HANNIAI 蓝色洗发水 750ml","IMG_3564(1).jpg",1500,"洗发水","洗护"],["WOZHIAN 沐浴露＋磨砂 400ml","IMG_3565(1).jpg",1000,"沐浴磨砂二合一","洗护"],["HANNIAI 香氛沐浴露 1L","IMG_3566(1).jpg",1700,"香氛沐浴露","洗护"],["MPINBA 珠光香氛洗手液 500ml","IMG_3567(1).jpg",1200,"香氛洗手液","洗护"],["YOUMAIDOU 珠光香氛洗手液 420ml","IMG_3568(1).jpg",950,"洗手液","洗护"],["SADOER 牛油果维E六件套礼盒","new-01.jpg",null,"护肤礼盒","护肤礼盒"],["SADOER 玫瑰胜肽六件套礼盒","new-02.jpg",null,"护肤礼盒","护肤礼盒"],["人参滋养护肤十件套","new-03.jpg",null,"护肤礼盒","护肤礼盒"],["CULTURAL 香水＋护手霜礼盒（紫色）","new-04.jpg",500,"香氛礼盒","香氛礼盒"],["CuteLover 香水＋护手霜礼盒","new-05.jpg",500,"香氛礼盒","香氛礼盒"],["CULTURAL 香氛护手霜 HC-12","new-06.jpg",null,"护手霜","护手霜"],["CuteLover 香氛护手霜 HC-8","new-07.jpg",null,"护手霜","护手霜"],["FATALE ROSÉ 香氛五件套","new-08.jpg",3500,"香氛礼盒","香氛礼盒"],["Marc Jacobs Daisy 香水礼盒","new-09.jpg",3500,"香氛礼盒","香氛礼盒"],["CULTURAL 香氛护手霜 HC-13","new-10.jpg",null,"护手霜","护手霜"],["ADAD 脸部护理礼盒","new-11.jpg",2000,"护肤礼盒","护肤礼盒"],["V.V.LOVE I'M FABULOUS 香氛礼盒","new-12.jpg",2800,"香氛礼盒","香氛礼盒"],["Lyvv 圣诞护手霜五支套装","new-13.jpg",350,"护手霜","护手霜"]];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=document.querySelector('#search').value.trim().toLowerCase(),k=document.querySelector('#kind').value;const found=items.filter(p=>(p[0]+' '+p[3]).toLowerCase().includes(q)&&(!k||(p[0]+' '+p[3]+' '+p[4]).includes(k)));document.querySelector('#count').textContent=found.length;document.querySelector('#grid').innerHTML=found.map(p=>'<article class="card"><img loading="lazy" src="./'+encodeURIComponent(p[1])+'" alt="'+esc(p[0])+'"><div class="card-body"><span class="card-category">'+esc(p[4]||"洗护")+'</span><h3 class="card-title">'+esc(p[0])+'</h3><p class="card-desc">'+esc(p[3])+'</p><div class="card-footer"><span class="price">'+p[2].toLocaleString('en-US')+' ₸</span></div></div></article>').join('')||'<p class="empty-state">没有找到商品</p>'}
document.querySelector('#search').addEventListener('input',render);document.querySelector('#kind').addEventListener('change',render);render();
</script></body></html>
